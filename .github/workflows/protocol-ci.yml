name: Robot Protocol CI
on: [push, pull_request]
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate JSON
        run: python -m json.tool robot/protocol/commands.json >/dev/null
      - name: Install test deps
        run: pip install -r backend/requirements.txt
      - name: Test
        run: pytest -q backend/tests/test_analytics.py backend/tests/test_cross_sensor.py backend/tests/test_defects.py backend/tests/test_detection_events.py backend/tests/test_frame_store.py backend/tests/test_graph_engine.py backend/tests/test_realtime_analytics.py backend/tests/test_video_sync.py
