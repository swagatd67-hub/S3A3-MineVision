name: Backend CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-ml.txt --extra-index-url https://download.pytorch.org/whl/cu126
      - name: Lint
        run: ruff check backend robot
      - name: Test
        run: pytest -q
