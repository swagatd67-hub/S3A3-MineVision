name: Backend CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pipevision
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          pip install -r requirements-ml.txt --extra-index-url https://download.pytorch.org/whl/cu126
      - name: Init DB Schema
        run: python -c "import backend.app.models; from backend.app.db import init_db; init_db()"
      - name: Lint
        run: ruff check backend robot
      - name: Test
        run: pytest -q
